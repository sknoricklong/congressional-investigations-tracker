# Congressional Committee Update Monitor - Source Configuration
#
# Each source points to one list/archive page on a committee website.
# parser: must match a registered parser function in src/app/parsers/
# enabled: set to false to skip during daily runs
# tier: tier1 = launch day, tier2 = enable after baseline stable, tier3 = optional expansion

sources:
  # ============================================================
  # TIER 1 - Enabled at launch
  # ============================================================

  # --- House Oversight (Majority) ---
  - id: house_oversight_press
    name: "House Oversight - Press Releases"
    committee: "House Oversight and Government Reform"
    chamber: House
    party_lane: majority
    url: "https://oversight.house.gov/release/"
    collection: press
    kind: press_release
    tier: tier1
    parser: oversight_house_press
    enabled: true
    detail_fetch: html
    recent_item_limit: 20
    why_relevant: "Broad oversight and investigation announcements."

  - id: house_oversight_letters
    name: "House Oversight - Letters"
    committee: "House Oversight and Government Reform"
    chamber: House
    party_lane: majority
    url: "https://oversight.house.gov/letter/"
    collection: letters
    kind: letter
    tier: tier1
    parser: oversight_house_letters
    enabled: true
    detail_fetch: html
    recent_item_limit: 20
    why_relevant: "Letters and subpoenas often signal a new investigation."

  # --- House Judiciary (Majority) ---
